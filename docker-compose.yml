services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: wrc-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]

  timescaledb:
    image: timescale/timescaledb:2.32.0-pg16
    container_name: wrc-timescaledb
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
    ports:
      - "5432:5432"
    volumes:
      - ./db/data:/var/lib/postgresql/data
      # mounted file by file: mounting the whole folder would hide the
      # image's own TimescaleDB setup scripts in /docker-entrypoint-initdb.d
      - ./db/init/001_schema.sql:/docker-entrypoint-initdb.d/101_schema.sql:ro
      - ./db/init/002_seed.sql:/docker-entrypoint-initdb.d/102_seed.sql:ro

  grafana:
    image: grafana/grafana:latest
    container_name: wrc-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
